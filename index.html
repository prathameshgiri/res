<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Local Folder Viewer</title>
<style>
  :root{
    --bg:#0f0f10; --panel:#121212; --accent:#9aa0ff; --muted:#cfcfcf;
  }
  html,body{height:100%;margin:0;font-family: Georgia, "Times New Roman", serif;background:var(--bg);color:var(--muted)}
  .header{padding:20px 28px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;gap:20px;align-items:center}
  h1{margin:0;font-size:36px;color:white;letter-spacing:0.5px}
  .controls{margin-left:auto;display:flex;gap:10px;align-items:center}
  .btn{
    background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 14px;border-radius:8px;color:var(--muted);cursor:pointer;
  }
  .container{display:flex;padding:24px;gap:24px}
  .tree{width:420px;background:linear-gradient(180deg,#0b0b0b,#121212);border-radius:10px;padding:18px;box-shadow:0 6px 30px rgba(0,0,0,0.6)}
  .info{flex:1;background:linear-gradient(180deg,#0b0b0b,#131313);border-radius:10px;padding:18px;overflow:auto}
  .folder, .file{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:6px;margin:4px 0}
  .folder:hover, .file:hover{background:rgba(255,255,255,0.02)}
  .toggle{cursor:pointer;user-select:none;font-weight:bold;color:var(--accent)}
  .name{flex:1;color:#dcdcdc}
  .meta{color:#bdbdbd;font-size:13px;min-width:160px;text-align:right}
  .file a{color:var(--accent);text-decoration:none}
  .small{font-size:12px;color:#9b9b9b}
  .tree h3{margin:0 0 8px 0;color:#fff}
  .empty{color:#777;padding:20px;text-align:center}
  details{margin-left:6px}
  summary::-webkit-details-marker{display:none}
  .choose-label{display:inline-block;padding:10px 14px;border-radius:8px;background:#111;border:1px solid rgba(255,255,255,0.04);cursor:pointer;color:var(--muted)}
  .path{color:#aab0ff;font-size:14px;margin-top:6px}
</style>
</head>
<body>
  <div class="header">
    <h1>Index of Local Folder</h1>
    <div class="controls">
      <label class="choose-label">
        Choose folder
        <input id="dirPicker" type="file" webkitdirectory directory multiple style="display:none">
      </label>
      <button id="clearBtn" class="btn">Clear</button>
    </div>
  </div>

  <div class="container">
    <div class="tree" id="treePanel">
      <h3>Folder structure</h3>
      <div id="treeRoot" class="empty">Folder select karo upar "Choose folder" se.</div>
    </div>

    <div class="info">
      <h3>File info & preview</h3>
      <div id="infoArea" class="empty">Koi file open karke dekho — preview ya file open karne ka option yahan milega.</div>
    </div>
  </div>

<script>
/* Helper formatting */
function formatSize(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' kB';
  if(n < 1024*1024*1024) return (n/(1024*1024)).toFixed(1) + ' MB';
  return (n/(1024*1024*1024)).toFixed(2) + ' GB';
}
function formatDate(ms){ const d = new Date(ms); return d.toLocaleString(); }

/* Build nested tree from webkitRelativePath */
function buildTree(fileList){
  const root = {};
  for(const f of fileList){
    const path = f.webkitRelativePath || f.name;
    const parts = path.split('/');
    let node = root;
    for(let i=0;i<parts.length;i++){
      const p = parts[i];
      if(i === parts.length-1){
        // file
        if(!node._files) node._files = [];
        node._files.push({name:p, file: f});
      } else {
        if(!node[p]) node[p] = {};
        node = node[p];
      }
    }
  }
  return root;
}

/* Render tree into DOM */
function renderTree(node, container, basePath=''){
  container.innerHTML = '';
  const ul = document.createElement('div');

  function walk(curr, el, path){
    // folders
    Object.keys(curr).filter(k=>!k.startsWith('_')).sort().forEach(folderName=>{
      const folderNode = curr[folderName];
      const details = document.createElement('details');
      details.open = false;
      const summary = document.createElement('summary');
      summary.innerHTML = '<span class="toggle">📁</span> <span class="name">' + folderName + '</span>';
      details.appendChild(summary);
      const inner = document.createElement('div');
      inner.style.paddingLeft = '12px';
      walk(folderNode, inner, path + folderName + '/');
      details.appendChild(inner);
      el.appendChild(details);
    });
    // files
    if(curr._files){
      curr._files.sort((a,b)=>a.name.localeCompare(b.name)).forEach(fobj=>{
        const row = document.createElement('div');
        row.className = 'file';
        const icon = document.createElement('span'); icon.textContent = '📄';
        const name = document.createElement('div'); name.className='name';
        const link = document.createElement('a');
        link.href = '#';
        link.textContent = fobj.name;
        link.addEventListener('click', (e)=>{
          e.preventDefault();
          openFile(fobj.file);
        });
        name.appendChild(link);
        const meta = document.createElement('div'); meta.className='meta small';
        meta.textContent = formatSize(fobj.file.size) + ' • ' + formatDate(fobj.file.lastModified);
        row.appendChild(icon); row.appendChild(name); row.appendChild(meta);
        el.appendChild(row);
      });
    }
  }

  walk(node, ul, basePath);
  if(ul.children.length === 0){
    container.innerHTML = '<div class="empty">Is folder me koi file nahi mili.</div>';
  } else {
    container.appendChild(ul);
  }
}

/* Show file info & preview */
function openFile(file){
  const info = document.getElementById('infoArea');
  info.innerHTML = '';
  const title = document.createElement('div'); title.style.fontWeight='700'; title.style.marginBottom='8px';
  title.textContent = file.name;
  const meta = document.createElement('div'); meta.className='small';
  meta.textContent = 'Size: ' + formatSize(file.size) + ' • Modified: ' + formatDate(file.lastModified);
  const actions = document.createElement('div'); actions.style.marginTop='10px';
  const openBtn = document.createElement('button'); openBtn.className='btn'; openBtn.textContent='Open in new tab';
  openBtn.onclick = ()=> {
    const blobUrl = URL.createObjectURL(file);
    window.open(blobUrl, '_blank');
  };
  const downloadBtn = document.createElement('a'); downloadBtn.className='btn'; downloadBtn.textContent='Download';
  downloadBtn.href = URL.createObjectURL(file);
  downloadBtn.download = file.name;
  downloadBtn.style.marginLeft = '10px';
  actions.appendChild(openBtn); actions.appendChild(downloadBtn);

  info.appendChild(title); info.appendChild(meta); info.appendChild(actions);

  // If image/pdf/text — try inline preview
  if(file.type.startsWith('image/')){
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.style.maxWidth='100%'; img.style.marginTop='12px'; img.style.borderRadius='8px';
    info.appendChild(img);
  } else if(file.type === 'application/pdf'){
    const iframe = document.createElement('iframe');
    iframe.src = URL.createObjectURL(file);
    iframe.style.width='100%'; iframe.style.height='70vh'; iframe.style.marginTop='12px'; iframe.style.border='none';
    info.appendChild(iframe);
  } else if(file.type.startsWith('text/') || file.name.match(/\.(md|json|js|html|css|txt)$/i)){
    const reader = new FileReader();
    reader.onload = ()=> {
      const pre = document.createElement('pre');
      pre.style.maxHeight='60vh'; pre.style.overflow='auto'; pre.style.background='#0b0b0b';
      pre.style.padding='12px'; pre.style.borderRadius='8px'; pre.style.marginTop='12px';
      pre.textContent = reader.result;
      info.appendChild(pre);
    };
    reader.readAsText(file);
  } else {
    const note = document.createElement('div');
    note.className='small';
    note.style.marginTop='12px';
    note.textContent = 'Preview unavailable for this file type. Use "Open in new tab" or "Download".';
    info.appendChild(note);
  }
}

/* Wire up input */
const picker = document.getElementById('dirPicker');
const treeRoot = document.getElementById('treeRoot');
picker.addEventListener('change', (ev)=>{
  const files = Array.from(ev.target.files || []);
  if(files.length === 0) return;
  const tree = buildTree(files);
  renderTree(tree, treeRoot);
  // show selected path
  const header = document.querySelector('.tree h3');
  header.textContent = 'Folder structure — (Selected)';
  document.querySelector('.path')?.remove();
  const pathEl = document.createElement('div'); pathEl.className='path';
  pathEl.textContent = files[0].webkitRelativePath ? files[0].webkitRelativePath.split('/')[0] : 'Selected folder';
  document.querySelector('.tree').appendChild(pathEl);
});

/* Clear */
document.getElementById('clearBtn').addEventListener('click', ()=>{
  picker.value = '';
  treeRoot.innerHTML = '<div class="empty">Folder select karo upar "Choose folder" se.</div>';
  document.getElementById('infoArea').innerHTML = '<div class="empty">Koi file open karke dekho — preview ya file open karne ka option yahan milega.</div>';
  document.querySelector('.tree h3').textContent = 'Folder structure';
  document.querySelector('.path')?.remove();
});
</script>
</body>
</html>
