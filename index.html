<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM BREACH DETECTED</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff003c;
            --secondary: #ff8800;
            --bg-color: #050000;
            --glass-bg: rgba(20, 0, 0, 0.65);
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at center, transparent 0%, #000 100%),
                linear-gradient(rgba(255, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Ambient pulsing background */
        .ambient-light {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(255,0,0,0.15) 0%, rgba(0,0,0,0) 70%);
            animation: pulse-ambient 4s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes pulse-ambient {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* Glassmorphism Container */
        .warning-container {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 0, 60, 0.3);
            border-top: 4px solid var(--primary);
            border-bottom: 4px solid var(--primary);
            padding: clamp(30px, 5vw, 60px);
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(255, 0, 60, 0.2) inset;
            width: 90%;
            max-width: 700px;
            animation: container-entry 1s cubic-bezier(0.1, 1, 0.1, 1), container-shake 5s infinite;
            transform-style: preserve-3d;
        }

        @keyframes container-entry {
            0% { transform: scale(1.5) translateY(-50px) rotateX(-20deg); opacity: 0; filter: blur(20px); }
            100% { transform: scale(1) translateY(0) rotateX(0deg); opacity: 1; filter: blur(0); }
        }
        
        /* Occasional glitchy shake on the container */
        @keyframes container-shake {
            0%, 94% { transform: translate(0, 0) rotate(0deg); }
            95% { transform: translate(-5px, 3px) rotate(-1deg); filter: hue-rotate(90deg); }
            96% { transform: translate(5px, -2px) rotate(1deg); filter: blur(2px); }
            97% { transform: translate(-3px, -5px) rotate(-0.5deg); }
            98% { transform: translate(4px, 4px) rotate(0.5deg); filter: invert(1); }
            99% { transform: translate(-2px, 2px) rotate(-1deg); filter: none; }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Animated SVG Icon */
        .warning-icon {
            width: clamp(70px, 12vw, 130px);
            height: clamp(70px, 12vw, 130px);
            margin: 0 auto 20px;
            filter: drop-shadow(0 0 20px var(--primary));
            animation: pulse-icon 2s infinite;
        }
        
        .warning-icon path {
            fill: none;
            stroke: var(--primary);
            stroke-width: 4;
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: draw-icon 2s forwards, flash-icon 2s infinite 2s;
        }

        @keyframes draw-icon {
            to { stroke-dashoffset: 0; }
        }
        @keyframes flash-icon {
            0%, 100% { fill: rgba(255, 0, 60, 0.1); }
            50% { fill: rgba(255, 0, 60, 0.8); }
        }
        
        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px var(--primary)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 30px var(--primary)); }
        }

        /* Typography */
        h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(1.8rem, 5vw, 4rem);
            margin: 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: clamp(1px, 1vw, 4px);
            text-shadow: 2px 2px 0px var(--primary), -2px -2px 0px #00ffff;
            position: relative;
            display: inline-block;
        }
        
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--glass-bg);
            clip: rect(0, 0, 0, 0);
            padding-left: 2px;
        }
        
        .glitch-text::before {
            left: 3px;
            text-shadow: -2px 0 var(--primary);
            animation: glitch-anim-1 3s infinite linear alternate-reverse;
        }
        
        .glitch-text::after {
            left: -3px;
            text-shadow: 2px 0 #00ffff;
            animation: glitch-anim-2 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(10px, 9999px, 15px, 0); }
            20% { clip: rect(50px, 9999px, 50px, 0); }
            40% { clip: rect(30px, 9999px, 40px, 0); }
            60% { clip: rect(70px, 9999px, 75px, 0); }
            80% { clip: rect(20px, 9999px, 25px, 0); }
            100% { clip: rect(80px, 9999px, 85px, 0); }
        }
        
        @keyframes glitch-anim-2 {
            0% { clip: rect(65px, 9999px, 70px, 0); }
            20% { clip: rect(15px, 9999px, 20px, 0); }
            40% { clip: rect(85px, 9999px, 90px, 0); }
            60% { clip: rect(25px, 9999px, 30px, 0); }
            80% { clip: rect(45px, 9999px, 50px, 0); }
            100% { clip: rect(5px, 9999px, 10px, 0); }
        }

        .subtitle {
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            color: var(--secondary);
            margin: 15px 0 10px;
            text-shadow: 0 0 10px var(--secondary);
            font-weight: bold;
        }

        .description {
            font-size: clamp(0.85rem, 1.8vw, 1.1rem);
            color: #ccc;
            max-width: 500px;
            margin: 0 auto 25px;
            line-height: 1.6;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            animation: load-progress 10s forwards cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes load-progress {
            0% { width: 0%; }
            20% { width: 35%; }
            40% { width: 35%; }
            60% { width: 80%; }
            80% { width: 85%; }
            100% { width: 100%; }
        }

        .system-status {
            display: flex;
            justify-content: space-between;
            font-size: clamp(0.7rem, 1.2vw, 0.9rem);
            color: #ff4444;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Scanning Line */
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(255, 0, 60, 0.3);
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.5);
            animation: scan 4s linear infinite;
            z-index: 9999;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        /* Terminal Background */
        .terminal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 20px;
            color: rgba(255, 0, 60, 0.3);
            font-size: 13px;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            opacity: 0.6;
            text-align: left;
            line-height: 1.4;
        }
        
        .terminal-line {
            margin-bottom: 4px;
            white-space: nowrap;
        }

        /* Interaction overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10000;
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 30px;
        }
        
        .click-text {
            color: rgba(255,255,255,0.4);
            animation: blink 1.5s infinite;
            font-family: sans-serif;
            font-size: clamp(12px, 1.5vw, 16px);
            letter-spacing: 2px;
        }
        
        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Active Shake Class for JS */
        .active-shake {
            animation: intense-shake 0.1s infinite !important;
        }

        @keyframes intense-shake {
            0% { transform: translate(3px, 2px) rotate(0deg); }
            10% { transform: translate(-2px, -3px) rotate(-1deg); }
            20% { transform: translate(-4px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 3px) rotate(0deg); }
            40% { transform: translate(2px, -2px) rotate(1deg); }
            50% { transform: translate(-2px, 3px) rotate(-1deg); }
            60% { transform: translate(-4px, 2px) rotate(0deg); }
            70% { transform: translate(3px, 2px) rotate(-1deg); }
            80% { transform: translate(-2px, -2px) rotate(1deg); }
            90% { transform: translate(3px, 3px) rotate(0deg); }
            100% { transform: translate(2px, -3px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div class="scan-line"></div>
    <div class="ambient-light"></div>
    
    <div class="terminal" id="terminal">
        <!-- Terminal lines generated by JS -->
    </div>

    <div class="warning-container" id="main-card">
        <svg class="warning-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Outline triangle -->
            <path d="M50 10 L90 85 L10 85 Z" />
            <!-- Exclamation mark -->
            <line x1="50" y1="35" x2="50" y2="65" stroke="var(--primary)" stroke-width="6" stroke-linecap="round"/>
            <circle cx="50" cy="77" r="4" fill="var(--primary)"/>
        </svg>

        <h1 class="glitch-text" data-text="SYSTEM BREACH">SYSTEM BREACH</h1>
        
        <div class="subtitle">UNAUTHORIZED ACCESS DETECTED</div>
        
        <div class="description">
            Multiple firewall failures recorded. Unknown entity is attempting to extract encrypted data. Initiating defensive protocols.
        </div>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="system-status">
            <span>DATA LOCKDOWN</span>
            <span id="percentage">0%</span>
        </div>
    </div>
    
    <div class="overlay" id="overlay">
        <div class="click-text">CLICK TO INITIALIZE COUNTERMEASURES</div>
    </div>

    <script>
        // --- 1. Terminal Background Text Generation ---
        const terminal = document.getElementById('terminal');
        const commands = [
            "ERR_CONNECTION_REFUSED",
            "WARN: Firewall node 42 offline",
            "Executing trace_route.sh...",
            "Attempting to block IP: 192.168.##.##",
            "CRITICAL: Memory leak detected in sector 7",
            "Bypassing security protocols...",
            "Accessing root directory...",
            "Decrypting payload...",
            "ERROR: Invalid handshake",
            "KERNEL PANIC",
            "UNAUTHORIZED ROOT LOGIN DETECTED",
            "DOWNLOADING CORE_DB.SQL..."
        ];

        function addTerminalLine() {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            
            const time = new Date().toISOString().split('T')[1].slice(0, 12);
            const randomCmd = commands[Math.floor(Math.random() * commands.length)];
            const hex = Math.floor(Math.random()*16777215).toString(16).toUpperCase().padStart(6, '0');
            
            line.innerText = `[${time}] [0x${hex}] - ${randomCmd}`;
            terminal.appendChild(line);
            
            // Keep the terminal from overflowing DOM infinitely
            if (terminal.childElementCount > 35) {
                terminal.removeChild(terminal.firstChild);
            }
        }
        
        // Add a line every 120ms
        setInterval(addTerminalLine, 120);
        // Pre-fill terminal
        for(let i=0; i<35; i++) addTerminalLine();

        // --- 2. Progress Bar Logic ---
        const percentageText = document.getElementById('percentage');
        let percent = 0;
        
        // Match the CSS animation timing
        setTimeout(() => { percent = 35; percentageText.innerText = percent + "%"; }, 2000);
        setTimeout(() => { percent = 80; percentageText.innerText = percent + "%"; }, 6000);
        setTimeout(() => { percent = 85; percentageText.innerText = percent + "%"; }, 8000);
        setTimeout(() => { 
            percent = 100; 
            percentageText.innerText = percent + "%"; 
            document.querySelector('.system-status span:first-child').innerText = 'LOCKDOWN COMPLETE'; 
            percentageText.style.color = '#00ffaa'; 
        }, 10000);

        // --- 3. 3D Tilt Effect on Desktop ---
        const card = document.getElementById('main-card');
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });
        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // --- 4. Cyberpunk Audio & Intense Screen Shake ---
        const overlay = document.getElementById('overlay');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let alarmInterval;
        let isHigh = false;
        
        function playAlarm() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            // Cyberpunk style aggressive synth beep
            osc.type = 'sawtooth';
            
            const now = audioCtx.currentTime;
            const freq = isHigh ? 1000 : 700;
            isHigh = !isHigh;
            
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq/2, now + 0.2);
            
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(now);
            osc.stop(now + 0.2);
            
            // Trigger a fast, aggressive full-screen shake randomly with the alarm
            if(Math.random() > 0.5) {
                document.body.classList.add('active-shake');
                setTimeout(() => document.body.classList.remove('active-shake'), 120);
            }
        }

        // Initialize on click/touch
        function initCountermeasures() {
            if (!alarmInterval) {
                overlay.style.display = 'none';
                audioCtx.resume().then(() => {
                    playAlarm();
                    alarmInterval = setInterval(playAlarm, 300); // Fast tempo
                });
                // Make background more aggressive
                document.querySelector('.ambient-light').style.background = 'radial-gradient(circle, rgba(255,0,0,0.3) 0%, rgba(0,0,0,0) 80%)';
                document.querySelector('.scan-line').style.background = 'rgba(255, 0, 60, 0.8)';
            }
        }

        overlay.addEventListener('click', initCountermeasures);
        overlay.addEventListener('touchstart', initCountermeasures);
        
    </script>
</body>
</html>
