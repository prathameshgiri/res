<title>Asset Manager | Prathamesh Giri</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  min-height:100vh;
  padding:20px;
}
.container{max-width:1400px;margin:0 auto}
header{
  text-align:center;
  color:#fff;
  margin-bottom:40px;
  padding:20px;
}
h1{
  font-size:2.8em;
  margin-bottom:10px;
  text-shadow:3px 3px 6px rgba(0,0,0,.3);
}
.subtitle{
  font-size:1.1em;
  opacity:.9;
}
.search-box{
  margin:20px 0 30px;
  text-align:center;
}
.search-box input{
  width:100%;
  max-width:600px;
  padding:15px 20px;
  font-size:1em;
  border:none;
  border-radius:50px;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
  outline:none;
}
.category{
  background:#fff;
  border-radius:15px;
  padding:25px;
  margin-bottom:30px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  animation:fadeIn .5s ease-in;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.category-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:3px solid #667eea;
  padding-bottom:12px;
  margin-bottom:20px;
}
.category-title{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:1.6em;
  color:#333;
}
.file-count{
  background:#667eea;
  color:#fff;
  padding:5px 15px;
  border-radius:20px;
  font-size:.85em;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:18px;
}
.card{
  background:#fff;
  border:2px solid #e8e8e8;
  border-radius:10px;
  overflow:hidden;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  cursor:pointer;
}
.card:hover{
  transform:translateY(-5px) scale(1.02);
  box-shadow:0 12px 24px rgba(0,0,0,.15);
  border-color:#667eea;
}
.card img{
  width:100%;
  height:190px;
  object-fit:cover;
  background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%);
  border-bottom:3px solid #667eea;
}
.file-icon{
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:4em;
  background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%);
  border-bottom:3px solid #667eea;
}
.info{
  padding:15px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;
}
.filename{
  font-weight:600;
  margin-bottom:8px;
  font-size:.95em;
  word-break:break-word;
  line-height:1.4;
}
.filepath{
  font-size:.72em;
  opacity:.85;
  margin:6px 0 10px;
  font-family:'Courier New',monospace;
  background:rgba(255,255,255,.15);
  padding:6px 8px;
  border-radius:4px;
  word-break:break-all;
}
.btn-copy{
  background:#4CAF50;
  border:none;
  padding:9px 14px;
  border-radius:6px;
  color:#fff;
  cursor:pointer;
  font-size:.88em;
  width:100%;
  font-weight:600;
  transition:.3s;
}
.btn-copy:hover{background:#45a049;transform:scale(1.03)}
.btn-copy:active{transform:scale(.98)}
.btn-copy.copied{background:#2196F3;animation:pulse .3s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.no-results{
  text-align:center;
  padding:60px 20px;
  color:#666;
  font-size:1.2em;
}
footer{
  text-align:center;
  color:#fff;
  padding:30px;
  margin-top:40px;
  opacity:.9;
}
@media(max-width:768px){
  h1{font-size:2em}
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .category{padding:15px}
}
</style>
</head>
<body>

const app = document.getElementById('app');
const searchInput = document.getElementById('searchInput');

function renderAssets(searchTerm = '') {
  app.innerHTML = '';
  let totalResults = 0;
  
  Object.keys(ASSETS).forEach(categoryName => {
    const {folder, files} = ASSETS[categoryName];
    
    const filteredFiles = files.filter(file => 
      file.toLowerCase().includes(searchTerm.toLowerCase()) ||
      categoryName.toLowerCase().includes(searchTerm.toLowerCase())
    );
    
    if (filteredFiles.length === 0) return;
    totalResults += filteredFiles.length;
    
    const section = document.createElement('div');
    section.className = 'category';
    section.innerHTML = `
      <div class="category-header">
        <div class="category-title">${categoryName}</div>
        <div class="file-count">${filteredFiles.length} files</div>
      </div>
      <div class="grid"></div>
    `;
    
    const grid = section.querySelector('.grid');
    
    filteredFiles.forEach(file => {
      const fullPath = `${folder}/${file}`;
      const isImage = /\.(jpg|jpeg|png|gif|webp|svg|ico)$/i.test(file);
      const isDoc = /\.(pdf|doc|docx)$/i.test(file);
      const isApk = /\.apk$/i.test(file);
      
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        ${isImage ? `<img src="${fullPath}" alt="${file}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-size=%2212%22%3ENo Preview%3C/text%3E%3C/svg%3E'">` : 
          `<div class="file-icon">${isDoc ? '📄' : isApk ? '📱' : '📁'}</div>`}
        <div class="info">
          <div class="filename">${file}</div>
          <div class="filepath">${fullPath}</div>
          <button class="btn-copy" onclick="copyPath('${fullPath}', this)">📋 Copy Link</button>
        </div>
      `;
      grid.appendChild(card);
    });
    
    app.appendChild(section);
  });
  
  if (totalResults === 0) {
    app.innerHTML = '<div class="no-results">😕 No files found for "' + searchTerm + '"</div>';
  }
}

searchInput.addEventListener('input', (e) => {
  renderAssets(e.target.value);
});

function copyPath(path, btn) {
  navigator.clipboard.writeText(path).then(() => {
    const original = btn.innerHTML;
    btn.innerHTML = '✅ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = original;
      btn.classList.remove('copied');
    }, 1800);
  }).catch(err => {
    alert('Copy failed! Path: ' + path);
  });
}

// Initial render
renderAssets();
</script>
